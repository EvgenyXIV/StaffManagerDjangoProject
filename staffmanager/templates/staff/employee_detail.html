<!-- НАСЛЕДНИК ШАБЛОНА base.html -->
{% extends "base.html" %}
{% block content %}
    <meta charset="UTF-8">
    <h1>ПОДРОБНОСТИ О СОТРУДНИКЕ</h1>
        <h2>
            {% include 'includes/employee_header.html' %}<br> <!--всё содержание блока header вынесли в отдельный файл 
                                                            staffmanager\templates\includes\employee_header.html-->
            {% if employee.main_image %}                     <!-- Проверям, есть ли фото сотрудника, чтобы страница "не упала", и выводим фото -->
                <img src="{{ employee.main_image.image.url }}"/>    <!-- Путь к фото upload_to="employee_images/" указан в image - экземпляре класса ImageField() в модели EmployeeImage-->
            {% endif %}
        </h2>
        
{% endblock %}
